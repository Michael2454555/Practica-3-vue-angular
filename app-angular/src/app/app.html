<main class="contenedor">
  <h1>Directorio de Usuarios - Angular</h1>

  <section class="controles">
    <input
      [(ngModel)]="textoBusqueda"
      type="text"
      placeholder="Buscar por nombre..."
    />

    <label>
      <input type="checkbox" [(ngModel)]="verSoloFavoritos" />
      Solo favoritos
    </label>

    <span class="contador">Favoritos: {{ favoritos.length }}</span>
  </section>

  <p *ngIf="cargando">Cargando...</p>
  <p *ngIf="error" class="error">{{ error }}</p>

  <section *ngIf="!cargando && !error" class="grilla">
    <app-usuario-card
      *ngFor="let user of listaFiltrada"
      [usuario]="user"
      [esFavorito]="favoritos.includes(user.id)"
      (cambiarFavorito)="alternarFavorito($event)"
    ></app-usuario-card>
  </section>
</main>
